[package]
name = "openmls-uniffi"
version = "0.1.0"
authors = ["OpenMLS Authors"]
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "openmls_uniffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
openmls-recovery = { path = "../openmls-recovery" }
openmls_rust_crypto = { path = "../openmls_rust_crypto" }
uniffi = { version = "0.28", features = ["cli"] }
openmls-bindings-core = { path = "../openmls-bindings" }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
